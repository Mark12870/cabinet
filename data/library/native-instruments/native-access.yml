Name: Native Access
Kind: windows
Category: Manager
Summary: Native Instruments' manager for downloading and activating its software.
Developer: Native Instruments
Licence: Freeware
Licensing:
  The app is free, but its catalogue is tied to a Native Instruments account and
  the licences and subscriptions that account owns.
Formats: VST3
Homepage: https://www.native-instruments.com/en/pages/native-access/
Source: rolling
Url: https://assets.native-instruments.com/downloads/Native-Access_2.exe
Launch: C:\Program Files\Native Instruments\Native Access\Native Access.exe
VersionFile: C:\Program Files\Native Instruments\Native Access\Native Access.exe
LaunchService: NTKDaemonService
LaunchArgs:
  --no-sandbox
  --disable-gpu-sandbox
  --disable-gpu
  --disable-gpu-compositing
  --in-process-gpu
Scheme: native-access
Script: native-access.sh
Keep: drive_c/users/Public/Documents/Native Instruments/Downloads
Recover: kontakt-8.sh
Description:
  Not a plugin but the door to Native Instruments' catalogue: Kontakt, Battery,
  Komplete Kontrol, Massive X, FM8, Reaktor and more. Sign in, then choose the
  products and libraries your account owns.
