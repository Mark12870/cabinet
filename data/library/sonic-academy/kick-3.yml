InstallInstructions: Choose the KICK 3 ZIP from your Sonic Academy account, or the Windows installer inside it.
Script: sonic-academy.sh
Description:
  Builds a kick from up to five layers of synthesised sub and sampled click,
  drawn as pitch and amplitude envelopes, with harmonics, phase locking and
  key tracking per node. A kick sample, or one isolated from a full track,
  can be analysed into an editable click and sub. Two insert effect chains
  and a master channel add distortion, compression, EQ, delay and reverb.
