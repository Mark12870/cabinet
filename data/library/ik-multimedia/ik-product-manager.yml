Description:
  Not a plugin but the door to IK's catalogue: AmpliTube, SampleTank, T-RackS,
  MODO. You sign in, register and authorise what you own, and the app fetches
  each product and installs its plugin for you. The Custom Shop editions of
  AmpliTube 5, SampleTank 4 and T-RackS 5 are free and live only in here.

  So installing this installs nothing you can play yet — it is the door, and
  what you own arrives through it.
