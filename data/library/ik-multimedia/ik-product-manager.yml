Description:
  Not a plugin but the door to IK's catalogue: AmpliTube, SampleTank, T-RackS,
  MODO. You sign in, register and authorise what you own, and the app fetches
  each product and installs its plugin for you. The Custom Shop editions of
  AmpliTube 5, SampleTank 4 and T-RackS 5 are free and live only in here.

  So installing this installs nothing you can play yet. Cabinet opens it, and
  bridges each plugin the moment it lands — the app can stay open while it
  downloads. Its prefix is where the sounds live too, so expect it to grow, and
  removing the app takes that prefix with it: its own uninstaller leaves every
  product behind.
