Description:
  A drum sampler built for detailed acoustic kits, with multiple velocity layers,
  humanisation, mic bleed and up to sixteen separate audio outputs for mixing.

  DrumGizmo uses an open drumkit format, so community-made kits can be edited and
  shared instead of locking the sounds to one vendor's library. Kits are separate
  downloads from the plugin.
