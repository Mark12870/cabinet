Name: UVI Portal
Kind: windows
Category: Manager
Summary: UVI's manager for downloading, installing and updating its instruments and effects.
Developer: UVI
Version: 3.1.1
Licence: Freeware
Licensing:
  The manager and UVI Player are free. Portal requires a UVI account;
  commercial products require their own licences and iLok activation.
Formats: VST3, VST2
Homepage: https://www.uvi.net/uvi-portal
Source: download
Url: https://cdn.uvi.net/PORTAL_Uvi_portal/files/3.1.1/soft/UVI_Portal.exe
Sha256: a1706e2c1835ca84e2adff931d50517f3967116df1db9b8013e526f1adf88efa
Launch: C:\Program Files (x86)\UVI Portal\UVI Portal.exe
Script: uvi.sh
Description:
  UVI Portal brings product registration, downloads, installation and updates
  together for UVI instruments, sound libraries and effects, including Falcon
  and UVI Player.

  Installing Portal does not install a playable instrument. Sign in to your UVI
  account to install the free UVI Player and its Starter soundpack, or manage
  commercial products whose licences are activated through iLok License Manager.
