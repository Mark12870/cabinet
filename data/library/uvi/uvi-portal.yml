Script: uvi.sh
Description:
  UVI Portal brings product registration, downloads, installation and updates
  together for UVI instruments, sound libraries and effects, including Falcon
  and UVI Player.

  Installing Portal does not install a playable instrument. Sign in to your UVI
  account to install the free UVI Player and its Starter soundpack, or manage
  commercial products whose licences are activated through iLok License Manager.
