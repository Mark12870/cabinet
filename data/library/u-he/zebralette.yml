Description:
  A single oscillator taken out of Zebra and given a synth of its own: ADSR
  envelope, MSEG, two LFOs, a modulation matrix, and delay and reverb. The
  waveform editor is the point — draw it, morph it, and hear it while you do.

  The most capable of u-he's free plugins.
