Description:
  A synth Amazona.de designed as hardware that was never built; u-he wrote
  its engine from an early version of Diva. Two oscillators, noise and ring
  modulation into a Diva-style filter, two LFOs and up to eight-voice
  unison. Amazona gave it away for fourteen years before u-he took it over.
