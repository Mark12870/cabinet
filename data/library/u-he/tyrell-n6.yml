Description:
  Amazona.de designed a hardware synth that was never built; u-he wrote it in
  software instead, out of an early version of what became Diva. Two
  oscillators, a proper filter section and enough modulation to earn the name.

  Given away for fourteen years through Amazona and now hosted by u-he, who
  rebuilt the VST3 side and added CLAP. Their Linux build is labelled beta.
