Description:
  A smaller Bazille: two digital oscillators running FM, phase distortion
  and fractal resonance, one analogue-style multimode filter, a 16-step
  sequencer and patch cords between all of it. Computer Music magazine
  commissioned it for its readers; since the magazine closed, u-he gives it
  away.
