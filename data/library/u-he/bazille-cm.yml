Description:
  The small brother of Bazille, u-he's modular monster: digital oscillators
  doing phase distortion and fractal resonance, an analogue-style filter, and
  patch cords between whatever you like.

  Commissioned by Computer Music magazine for its readers. The magazine has
  since closed and the publisher let u-he keep hosting it. Linux build is beta.
