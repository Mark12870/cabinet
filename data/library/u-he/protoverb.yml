Description:
  A reverb that models a room rather than an impulse: it builds up resonances
  the way a real space does, which gives it ghost echoes and keeps instruments
  separated in the tail.

  u-he call it researchware — it exists to feed their reverb research, and it
  is free because of that. The Linux build is their own and is labelled beta.
