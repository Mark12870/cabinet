Description:
  Aalto's reverb pulled out as an effect worth performing with, after the vintage spring
  reverbs that inspired it. The size control shifts the whole space as it moves, the way a
  tape delay shifts pitch with speed, and at the top of its range the decay slides into a
  freeze that never loops.

  Four knobs, and the tone control is an isolator rather than an EQ.
