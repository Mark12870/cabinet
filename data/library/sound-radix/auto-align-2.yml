Description:
  Measures the delay and the spectral phase between microphones on one
  source, such as a drum kit or a doubled amp, and aligns them in one pass,
  picking the reference and grouping related tracks itself. Its spectral
  module also corrects the phase shift filters add, which removes comb
  filtering.
