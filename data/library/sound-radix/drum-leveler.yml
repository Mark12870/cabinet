Description:
  Detects each drum hit and gains it towards a target level instead of
  following an envelope, compressing loud hits and raising soft ones, or
  expanding them when the amount goes negative. A high and a low threshold
  pick which hits it touches, so ghost notes or bleed can be left alone;
  a side-chain filter and gate range narrow it to one drum of a kit.
