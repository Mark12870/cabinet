Description:
  Goes on the last insert of every track; the instances share one
  background process that keeps adjusting each track's phase, so sources
  with overlapping frequencies, such as kick and bass, stop cancelling each
  other. 64 groups bind multi-mic recordings or related instruments. Load
  the VST3 on every track: VST2 instances cannot see each other here.
  Needs a graphics card with OpenGL 2.1.
