Description:
  A loudness leveler measuring K-weighted LKFS feeds Sound Radix's own
  fast compression engine. Punch shapes transients apart from the attack
  time, and Adaptive Compression holds the average gain reduction steady
  so a performance keeps its dynamics. For riding vocals, dialogue and
  mixes to a target loudness, with L/R or M/S linking and a band-pass or
  band-reject side-chain filter.
