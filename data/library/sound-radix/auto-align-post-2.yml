Description:
  For dialogue: keeps boom and lavalier mics aligned while actors and
  cameras move, by up to ±100 ms, about 34 m. A static mode locks mics
  that do not move, and spectral phase correction undoes the shift a
  filter on one of them adds. It works on clips through ARA2, so the
  DAW must host ARA, and it has a phase correlation meter.
