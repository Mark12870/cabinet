Name: TAL-NoiseMaker
Kind: native
Category: Synth
Summary: Virtual analogue synth with a step sequencer and effects.
Developer: TAL Software
Licence: Freeware
Formats: VST3, CLAP, VST2
Homepage: https://tal-software.com/products/tal-noisemaker
Source: rolling
Url: https://tal-software.com/downloads/plugins/TAL-NoiseMaker_64_linux.zip
Description:
  Two oscillators over a sub and a noise source, ring modulation between
  them, a multimode filter, two LFOs and a step sequencer that can be
  pointed at most of the panel — then chorus, crusher, reverb and delay on
  the way out, all of it on one page.

  It ships with 256 presets and TAL make a point of how little CPU it takes,
  so running several at once is not the problem it might be. Along the
  bottom is a small modulation matrix — velocity and the pitch wheel wired
  to volume, cutoff and pitch.
