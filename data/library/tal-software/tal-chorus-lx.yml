Description:
  The two modes the hardware had, I and II, emulated from it — plus a dry
  and wet balance and a stereo width the Juno never offered, which is what
  lets it sit on something other than a synth.

  Four controls and no menu. It is the one effect here with nothing to
  decide beyond how much of it you want.
