Name: Waves Central
Kind: windows
Category: Manager
Summary: Waves plugin installer
Developer: Waves
Licence: Freeware
Licensing:
  The manager is free. A Waves account and product licences or a Creative Access
  subscription are needed to activate plugins.
Formats: VST3
Homepage: https://www.waves.com/downloads/central
Source: rolling
Url: https://cf-installers.waves.com/WavesCentral/Install_Waves_Central.exe
Launch: C:\Program Files\Waves Central\Waves Central.exe
VersionFile: C:\Program Files\Waves Central\Waves Central.exe
LaunchArgs:
  --no-sandbox
  --disable-gpu
Scheme: waves-central
Script: waves.sh
Description:
  Waves' catalogue of mixing and mastering plugins, many of them modelled on
  studio hardware such as SSL, API and Neve consoles, and signature chains
  from engineers such as Chris Lord-Alge, with the Creative Access
  subscription. If its window opens blank, resize it once.
