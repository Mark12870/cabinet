Name: Vital
Kind: native
Category: Synth
Summary: Spectral warping wavetable synth
Developer: Matt Tytel
Version: 1.0.7 stable / 1.6.4 early access
Licence: Freeware
Licensing:
  One download serves every tier: the free version is fully functional, and
  Plus and Pro add presets, wavetables and skins, unlocked by signing in.
  1.0.7 is the stable release. 1.6.4 is early access; presets saved in it
  cannot be opened by older versions.
Formats: VST3, VST2, LV2, CLAP
Script: vital.sh
Relink: libcurl-gnutls.so.4 = libcurl.so.4
Homepage: https://vital.audio
Source: byo
Account: https://account.vital.audio
Description:
  Three wavetable oscillators whose waves can be drawn, imported or made
  from samples, warped as they play by spectral modes that change their
  harmonics, plus a sample source, two filters and drag-and-drop modulation.
