Name: Spitfire Audio App
Kind: windows
Category: Manager
Summary: Spitfire Audio's library installer
Developer: Spitfire Audio
Licence: Freeware
Licensing:
  The app is free and signs in to a Spitfire account. What it will install is
  what that account owns; LABS and BBC Symphony Orchestra Discover cost nothing.
Formats: VST3
Homepage: https://www.spitfireaudio.com/en-eu/pages/spitfire-audio-app
Source: rolling
Url: https://www2.spitfireaudio.com/library-manager/download/win/
Launch: C:\Program Files\Spitfire Audio\Spitfire Audio.exe
Script: spitfire-audio.sh
Description:
  Spitfire's sampled orchestras and instruments, from the free LABS series
  and the smaller Originals to the BBC Symphony Orchestra, recorded at Maida
  Vale. Each library comes with its own plugin.
