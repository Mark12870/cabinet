Name: Spitfire Audio App
Kind: windows
Category: Manager
Summary: Spitfire's own manager, which downloads and installs their libraries.
Developer: Spitfire Audio
Licence: Freeware
Licensing:
  The app is free and signs in to a Spitfire account. What it will install is
  what that account owns; LABS and BBC Symphony Orchestra Discover cost nothing.
Formats: VST3, VST2
Homepage: https://www.spitfireaudio.com/en-eu/pages/spitfire-audio-app
Source: rolling
Url: https://www2.spitfireaudio.com/library-manager/download/win/
Prefix: spitfire-audio
Launch: C:\Program Files\Spitfire Audio\Spitfire Audio.exe
Script: spitfire-audio.sh
Runner: soda-11.0-5
Dxvk: true
Sync: system
Description:
  Not a plugin but the door to Spitfire's catalogue: LABS, the Originals, the
  BBC Symphony Orchestra. You sign in, pick from what your account owns, and
  the app fetches each library and installs its plugin for you.

  So installing this installs nothing you can play yet. Cabinet opens it, and
  bridges each library the moment it lands — the app can stay open while it
  downloads. Its prefix is where the samples live too, so expect it to grow,
  and removing the app takes that prefix with it: its own uninstaller leaves
  every library behind.
