Description:
  The amp models, cabinets and effects of Line 6's Helix Stadium hardware:
  Agoura, the amp modelling Line 6 built for Stadium, beside the HX models
  carried over from Helix, on a signal path of up to 48 blocks you arrange.
  Presets move between the plugin and Helix Stadium XL and Floor, and it
  imports Helix Native presets, which do not go back the other way.
