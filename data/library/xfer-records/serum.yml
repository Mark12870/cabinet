Description:
  The wavetable synth most of the last decade's electronic music was made
  with: draw or import a wavetable, watch it move, and modulate anything by
  dragging onto it.

  There is no Linux build, so Cabinet gives it a Wine prefix of its own with
  the Wine version its editor needs and DXVK for the drawing. You supply the
  installer you bought, and it runs through on its own with no wizard to click.
