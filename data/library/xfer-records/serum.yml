Runner: wine-d2d1-11.0
Sync: fsync
Description:
  The wavetable synth most of the last decade's electronic music was made
  with: draw or import a wavetable, watch it move, and modulate anything by
  dragging onto it.

  There is no Linux build, so Cabinet gives it a Wine prefix of its own with
  the Direct2D build its JUCE 8 editor needs. DXVK is left off — paired with
  that build it stops the editor from painting at all; without it, the editor
  needs a nudge (resize or move the window) after opening before it draws.
  You supply the installer you bought, and it runs through on its own with
  no wizard to click.
