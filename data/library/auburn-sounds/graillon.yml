Description:
  Pitch correction with a hard-tune end and a natural one, formant shifting
  beside it, and three pitch engines to choose between — the Graillon 2
  sound, a reworked one, and the engine out of Inner Pitch.

  A compressor, gate, chorus, preamp and bitcrusher sit in the same window,
  all tuned for voice and all adding no latency, which is what makes it a
  chain to sing through rather than one to print afterwards.
