Description:
  A gate with almost nothing on the surface, over a 43-band psychoacoustic
  model doing the envelope detection, program-dependent hysteresis deciding
  what counts as the sound, and look-ahead built in so the transient is
  never the part that gets cut off.

  That is what makes it quick to set: there is no threshold and hold pair
  to retune for every source, and the LED can be clicked to open the gate
  by hand where a part needs it.
