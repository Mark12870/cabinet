Description:
  Attacks turned up or down by one knob, over a two-band detector that
  finds each transient on its own — there is no threshold to place, and
  changing the input gain does not change the result.

  It goes on a drum track to make it punchier, on a kick to take the click
  off, or across a bus for glue; pointed at the start of notes on a vocal
  it takes the edge off sibilance without a de-esser's filter.
