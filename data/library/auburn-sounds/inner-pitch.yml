Description:
  Pitch and formants shifted apart from each other, a dry and wet balance
  that reinforces the bottom rather than replacing it, and an L/R pitch
  difference that widens a mono track. The performance stays recognisable.

  Pushed, it stops being polite: an internal delay limiter builds endlessly
  ascending or descending sounds, and the distortion, EQ and diffusion in
  the loop take it to the soundscape end of a pitch shifter.
