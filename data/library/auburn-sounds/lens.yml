Description:
  Up to 64 companders working across the spectrum at once, compressing and
  expanding without the phase shift a crossover costs and without the
  ringing a linear-phase EQ costs. Sidechain EQ and output EQ are set
  together rather than one at a time.

  Upwards compression is where it goes past a multiband compressor:
  material masked by what sits next to it can be lifted out or taken away
  altogether, which is what it is reached for on a master bus.
