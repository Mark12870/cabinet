Description:
  Diffusion that runs from sparse to plate-like, a vintage knob for the
  older sound, an eight-band damping EQ, a freeze for an infinite tail, and
  ducking and gating inside rather than on a plugin after it.

  The path is 64-bit throughout and the post-EQ is drawn as shelves you can
  see, so fitting it into a mix is done by looking at it. Adaptive
  diffusion is what keeps a transient — a piano, say — out of the noise.
