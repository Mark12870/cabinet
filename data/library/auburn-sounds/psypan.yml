Description:
  Five binaural panners, three volume-based modes with the classic pan
  laws, and nine that are frankly effects — Haas, doubler, chorus,
  micro-shifting, a peak panner, a widener and three mid/side variants —
  all behind the one control.

  It grew out of GFM Psypan from 2011, whose binaural panner is still in
  here beside a newer algorithm for front-facing rotation. The way to use
  it is to pan first and browse the modes second.
