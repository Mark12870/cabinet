Description:
  A track placed anywhere in the field by a binaural panner, with early and
  late reflections following it so that distance reads as distance, and
  width, tilt and an LFO that reaches most of the panel.

  Its reverb is sparse rather than diffuse, which is the decision the whole
  thing turns on: it leaves headroom and stays out of the way, so it
  survives being put on the master rather than only on a send.
