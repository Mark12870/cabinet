Description:
  A matrix of room, hall, plate and spring reverbs and their variants.
  Distance replaces dry/wet and pre-delay by also changing density and high-
  frequency damping, and Size replaces reverb time. Learning tailors the tail
  to the source; in Group Mode it also keeps tails of several tracks from
  masking each other. Wet Mode suits a send.
