Description:
  Listens to a few seconds of audio and computes a spectral filter from a
  profile for the source, such as vocals, drums or a full mix, which Impact
  then scales. Up to ten instances form a group in Front, Middle and Back
  layers, and the filters then also reduce masking between those tracks.
  Dynamic bands, mid/side and a reference track sit beside it.
