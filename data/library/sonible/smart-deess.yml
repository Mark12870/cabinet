Description:
  A neural network finds each S, Z, Sh, Ch, T and P sound in a voice and
  reduces the whole phoneme rather than a frequency band's peaks, after
  learning a short voiceprint of the speaker. Made for vocal and speech tracks
  and busses, not instruments; its look-ahead of about 70 ms rules out live
  use.
