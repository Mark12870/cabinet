Description:
  Learns the signal and maps the compression it allows onto a 2D Compression
  Matrix; moving one point sets threshold, ratio, attack and release together.
  Compression works per frequency band, Input Riding levels the signal before
  it, and a zero-latency mode serves tracking. Group Mode adjusts up to seven
  tracks at once.
