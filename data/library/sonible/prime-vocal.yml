Description:
  Neural networks remove noise, room sound, sibilance and plosives from whole
  vocal or dialogue files, as an ARA plugin in DAWs that host ARA. Analysis
  runs about as long as the audio, and sections become editable as they
  finish. Analysis data takes about 90 MB per minute of audio.
