Name: Parallel Aggressor
Kind: windows
Category: Effect
Summary: Parallel compression and saturation
Developer: Baby Audio
Licence: Commercial
Licensing:
  The plugin runs in trial mode until it is activated with a licence key.
Formats: VST3, VST2
Homepage: https://babyaud.io/parallel-aggressor-plugin
Source: rolling
Url: https://babyaudiosoftware.s3.us-east-2.amazonaws.com/Parallel+Aggressor+Baby+Audio+PC.zip
Script: baby-audio.sh
Description:
  Splits the input into three signals mixed back together: the dry track,
  Spank, a heavily compressed copy, and Heat, a saturated one with low and
  high preservation filters. Four buttons per engine change its character,
  each copy can be soloed, and auto gain matches the sum to the input.
