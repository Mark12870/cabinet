Description:
  Repeats tempo-synced or free from 0.01 ms to 2.5 s, through 14 shaping
  effects on the wet signal: an 11-bit path after early digital delays,
  tape-style saturation, phaser, diffusion reverb, width, pitch spread and
  random timing. A ducker lowers the repeats while the dry signal plays.
