Description:
  Chains any of 28 effect modules, from filters, reverb and delay to an
  oscillator and noise for sweeps, and sets any of their parameters in
  motion from one T knob, an LFO-style rhythm, the input's level, a
  sidechain, a trigger or a host-synced launch. Made with Andrew Huang.
