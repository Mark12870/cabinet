Name: Crystalline
Kind: windows
Category: Effect
Summary: Algorithmic reverb on an allpass loop
Developer: Baby Audio
Licence: Commercial
Licensing:
  The plugin runs in trial mode until it is activated with a licence key.
Formats: VST3, VST2
Homepage: https://babyaud.io/crystalline
Source: rolling
Url: https://babyaudiosoftware.s3.us-east-2.amazonaws.com/Crystalline+Baby+Audio+PC.zip
Script: baby-audio.sh
Description:
  Sets room size and decay length apart, so a huge space can have a short
  tail. Pre-delay and decay sync to the host tempo; a ducker, filters,
  low-end taming and harshness smoothing sit beside freeze, shimmer,
  modulation and reverse. Resolution trades fidelity against CPU.
