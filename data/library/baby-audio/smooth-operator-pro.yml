Name: Smooth Operator Pro
Kind: windows
Category: Effect
Summary: Spectral resonance suppressor
Developer: Baby Audio
Licence: Commercial
Licensing:
  The plugin runs in trial mode until it is activated with a licence key.
Formats: VST3, VST2
Homepage: https://babyaud.io/smooth-operator-plugin
Source: rolling
Url: https://babyaudiosoftware.s3.us-east-2.amazonaws.com/Smooth+Operator+Pro+Baby+Audio+PC.zip
Script: baby-audio.sh
Description:
  Splits the signal spectrally and turns down build-up and harsh resonances
  only where and when they occur, against a target curve drawn with EQ
  nodes. Any node can override the global settings, for example to work on
  the sides only, and a sidechain input lets one track carve room for
  another.
