Name: TAIP
Kind: windows
Category: Effect
Summary: Tape saturation modelled by a neural net
Developer: Baby Audio
Licence: Commercial
Licensing:
  The plugin runs in trial mode until it is activated with a licence key.
Formats: VST3, VST2
Homepage: https://babyaud.io/taip-plugin
Source: rolling
Url: https://babyaudiosoftware.s3.us-east-2.amazonaws.com/TAIP+Baby+Audio+PC.zip
