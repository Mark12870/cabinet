DemoSha256: 3d7136e8b714f7f12b0aba28522d18c541b3963f66c56b725244f081f393f0cd
Script: modartt.sh
Description:
  A piano that is computed rather than sampled: strings, hammers, soundboard and
  room are modelled as you play, so every parameter from hammer hardness to lid
  position can be changed, and the whole instrument fits in a few dozen
  megabytes.

  Cabinet installs the free demo, or the archive you download from your Modartt
  account. Add-on instruments are bought and activated inside Pianoteq.
