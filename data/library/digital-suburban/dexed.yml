Description:
  Six-operator FM, modelled closely enough on the DX7 that it takes the
  original SysEx cartridges — thousands of which are on the web — and sounds
  like the hardware they were written for.

  Every parameter is on one panel rather than behind the DX7's two-line
  display, which is the part the original got wrong.
