Description:
  Works in the frequency domain, triggering a dynamic equaliser for each
  frequency of its FFT, which takes out harshness and single resonances in
  drums, guitars, vocals or a master. A slope tilts the detector towards pink
  noise, twelve pre-filter bands limit it to a region such as the highs for
  de-essing, and a custom threshold from an audio file turns it into a
  multiband compressor. An AI mode sets slope and threshold from the input.
