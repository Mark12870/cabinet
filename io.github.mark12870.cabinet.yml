app-id: io.github.mark12870.cabinet
# GNOME, not freedesktop: the GUI is GTK4 + libadwaita, which org.freedesktop.Platform
# does not carry. Bottles ships this same runtime over the same Wine base.
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.dotnet10
  # NativeAOT links with clang/lld, which the SDK alone does not carry.
  - org.freedesktop.Sdk.Extension.llvm20

# Wine comes from Flathub rather than being built here. `stable-25.08`, not
# `wow64-25.08`: yabridge's 32-bit host is a 32-bit *winelib* binary, which new
# WoW64 cannot run, and that is most of the older VST2 catalogue.
base: org.winehq.Wine
base-version: stable-25.08

command: cabinet

# `base:` copies the base app's files but NOT its extension declarations, so the
# multilib Wine we just inherited arrives with no 32-bit runtime and dies on
# `/lib/ld-linux.so.2: could not open`. These re-declare what org.winehq.Wine
# declares, and are what makes 32-bit plugin hosting work at all.
add-extensions:
  # Also lost with `base:`, and re-declarable despite belonging to another app.
  org.winehq.Wine.gecko:
    directory: share/wine/gecko
    version: stable-25.08

  org.winehq.Wine.mono:
    directory: share/wine/mono
    version: stable-25.08

  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: '25.08'

  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: '25.08'
    no-autodownload: true

  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: '1.4'
    versions: 25.08;25.08-extra;1.4
    subdirectories: true
    no-autodownload: true
    add-ld-path: lib
    merge-dirs: vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

finish-args:
  - --share=ipc                            # X11 MIT-SHM, for editor embedding
  - --share=network                        # plugin activation / licence servers
  # X11 is Wine's: yabridge's editor embedding and drag-and-drop are built on it.
  # Wayland is the GUI's alone -- both Prefixes and the shim blank WAYLAND_DISPLAY,
  # so granting it here cannot move Wine off X11 on either path into a prefix.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  # Load-bearing. yabridge's audio buffers are shm_open(), and `--device=all` does
  # NOT include /dev/shm -- verified: a sandbox without this sees an empty one.
  - --device=shm
  - --allow=multiarch                      # 32-bit plugin hosts
  # Read-only: $HOME is needed only to read an installer. Every write is a named dir.
  - --filesystem=home:ro
  # yabridgectl's output, where a DAW scans for plugins.
  - --filesystem=~/.vst3:create
  - --filesystem=~/.vst:create
  - --filesystem=~/.clap:create
  # Linux-native plugins only; yabridge bridges no LV2.
  - --filesystem=~/.lv2:create
  # A Library entry's `Data:` directory. u-he's plugins read their presets and resources
  # from this path by name, so `home:ro` above is not enough -- one grant per vendor.
  - --filesystem=~/.u-he:create
  # Masked under `home`, but honoured explicitly. `enrol` links yabridge into a DAW's
  # XDG_DATA_HOME here, the only place that DAW's chainloader looks.
  - --filesystem=~/.var/app
  # Cabinet's own files, read back through their host path because the chainloader hands
  # those to the shim. Masked under `home`. Both roots: a system install is outside $HOME.
  - --filesystem=~/.local/share/flatpak/app/io.github.mark12870.cabinet:ro
  - --filesystem=/var/lib/flatpak/app/io.github.mark12870.cabinet:ro
  # `doctor` reads an enrolled DAW's override file; it cannot ask flatpak from in here.
  - --filesystem=~/.local/share/flatpak/overrides:ro
  # `about` reads the origin remote's url, to tell a published build from a local one.
  # A single-file grant, honoured through the mask over ~/.local/share/flatpak.
  - --filesystem=~/.local/share/flatpak/repo/config:ro
  - --filesystem=/var/lib/flatpak/repo/config:ro
  # The socket directory, shared with the DAW on the other side of the boundary.
  - --filesystem=xdg-run/yabridge:create
  - --env=YABRIDGE_NO_WATCHDOG=1

modules:
  # Delivery only. The chainloader and libyabridge are loaded by the DAW, which reads
  # them from here through their host path; only Wine runs inside.
  - name: yabridge
    buildsystem: simple
    build-commands:
      # Mount points for the extensions declared above; flatpak needs them to exist.
      - install -d ${FLATPAK_DEST}/lib/i386-linux-gnu/GL
      - install -d ${FLATPAK_DEST}/lib/debug/lib/i386-linux-gnu
      - install -d ${FLATPAK_DEST}/share/wine/gecko
      - install -d ${FLATPAK_DEST}/share/wine/mono
      - install -d ${FLATPAK_DEST}/lib/yabridge
      - cp -a . ${FLATPAK_DEST}/lib/yabridge/
    sources:
      - type: archive
        # Bumped in place by scripts/update-yabridge.py.
        url: https://github.com/robbert-vdh/yabridge/releases/download/5.1.1/yabridge-5.1.1.tar.gz
        sha256: d11f0307412b5566b09a75ed4aa191266db56d22f4de4d20e4fbde6296cd1a47

  # No cargo-sources.json: the shim depends on nothing but std, so an offline
  # build needs nothing vendored. Keep it that way.
  - name: cabinet-wine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cabinet-wine/cargo
    build-commands:
      - cargo build --offline --release
      # Not in bin/: exec'd by the DAW, never run in here.
      - install -Dm755 target/release/cabinet-wine ${FLATPAK_DEST}/lib/yabridge/cabinet-wine
    sources:
      - type: dir
        path: shim

  - name: cabinet
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      - dotnet publish src/Cabinet.Cli -c Release --source ./nuget-sources -o publish
      - dotnet publish src/Cabinet.Gui -c Release --source ./nuget-sources -o publish-gui
      - install -Dm755 publish/cabinet ${FLATPAK_DEST}/bin/cabinet
      - cp -a publish-gui ${FLATPAK_DEST}/lib/cabinet-gui
      - ln -s ../lib/cabinet-gui/cabinet-gui ${FLATPAK_DEST}/bin/cabinet-gui
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # The plugin catalogue the Library page reads: one directory per vendor holding its
      # entries, its install script and its artwork. Bundled, so the list works offline.
      - |
        for vendor in data/library/*/; do
          # A vendor whose directory carries a .md is held back: the entry is written and
          # the tests check it, but the app does not offer it. That .md says why.
          if ls "$vendor"*.md >/dev/null 2>&1; then continue; fi
          dest=${FLATPAK_DEST}/share/cabinet/library/$(basename "$vendor")
          install -Dm644 "$vendor"*.yml -t "$dest"/
          for art in "$vendor"*.jpg "$vendor"*.png; do
            if [ -f "$art" ]; then install -Dm644 "$art" -t "$dest"/; fi
          done
          for script in "$vendor"*.sh; do
            if [ -f "$script" ]; then install -Dm755 "$script" -t "$dest"/; fi
          done
          for response in "$vendor"*.iss; do
            if [ -f "$response" ]; then install -Dm644 "$response" -t "$dest"/; fi
          done
        done
    sources:
      - type: dir
        path: src
        dest: src
      - type: dir
        path: data
        dest: data
      - type: file
        path: io.github.mark12870.cabinet.metainfo.xml
      - type: file
        path: io.github.mark12870.cabinet.desktop
      # Generated by flatpak-dotnet-generator.py; required even with no
      # third-party packages, because NativeAOT pulls ILCompiler from NuGet.
      - nuget-sources.json
