  # No cargo-sources.json: the shim depends on nothing but std, so an offline
  # build needs nothing vendored. Keep it that way.
  - name: cabinet-wine
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/cabinet-wine/cargo
    build-commands:
      - cargo build --offline --release
      # Not in bin/: exec'd by the DAW, never run in here.
      - install -Dm755 target/release/cabinet-wine ${FLATPAK_DEST}/lib/yabridge/cabinet-wine
    sources:
      - type: dir
        path: shim

  - name: cabinet
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/dotnet10/bin:/usr/lib/sdk/llvm20/bin
      prepend-ld-library-path: /usr/lib/sdk/llvm20/lib
      env:
        DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
        DOTNET_NOLOGO: '1'
    build-commands:
      - dotnet publish src/Cabinet.Cli -c Release --source ./nuget-sources -o publish
      - dotnet publish src/Cabinet.Gui -c Release --source ./nuget-sources -o publish-gui -p:UseSharedCompilation=false
      - install -Dm755 publish/cabinet ${FLATPAK_DEST}/bin/cabinet
      - cp -a publish-gui ${FLATPAK_DEST}/lib/cabinet-gui
      - ln -s ../lib/cabinet-gui/cabinet-gui ${FLATPAK_DEST}/bin/cabinet-gui
      - install -Dm644 ${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm644 ${FLATPAK_ID}.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 data/${FLATPAK_ID}.svg
        ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      # The plugin catalogue the Library page reads: one directory per vendor holding its
      # entries, its install script and its artwork. Bundled, so the list works offline.
      - |
        for vendor in data/library/*/; do
          # A vendor whose directory carries a .md is held back: the entry is written and
          # the tests check it, but the app does not offer it. That .md says why.
          if ls "$vendor"*.md >/dev/null 2>&1; then continue; fi
          dest=${FLATPAK_DEST}/share/cabinet/library/$(basename "$vendor")
          install -Dm644 "$vendor"*.yml -t "$dest"/
          for art in "$vendor"*.jpg "$vendor"*.png; do
            if [ -f "$art" ]; then install -Dm644 "$art" -t "$dest"/; fi
          done
          for script in "$vendor"*.sh; do
            if [ -f "$script" ]; then install -Dm755 "$script" -t "$dest"/; fi
          done
          for response in "$vendor"*.iss; do
            if [ -f "$response" ]; then install -Dm644 "$response" -t "$dest"/; fi
          done
          for payload in "$vendor"*.zip; do
            if [ -f "$payload" ]; then install -Dm644 "$payload" -t "$dest"/; fi
          done
        done
    sources:
      - type: dir
        path: src
        dest: src
      - type: dir
        path: data
        dest: data
      - type: file
        path: io.github.mark12870.cabinet.metainfo.xml
      - type: file
        path: io.github.mark12870.cabinet.desktop
      # Generated by flatpak-dotnet-generator.py; required even with no
      # third-party packages, because NativeAOT pulls ILCompiler from NuGet.
      - nuget-sources.json
