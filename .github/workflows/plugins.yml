name: Plugins

# Every catalogue entry's end-to-end scenario, every day, against a Cabinet built from main: the
# catalogue ships inside the app, so the entries a scenario reads are the ones this build carries.
# A vendor that moves a download or changes an installer shows up here without anyone pushing.
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report plugin scenario coverage
        run: scripts/scenario-coverage.sh

  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # bwrap needs to set up its own namespaces to build inside a container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/build

  runtime:
    runs-on: ubuntu-latest
    # A run with nothing to reuse installs everything itself, vendor installers and all.
    timeout-minutes: 350
    permissions:
      actions: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/runtime
        with:
          suite: scenarios
