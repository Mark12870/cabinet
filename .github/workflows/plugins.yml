name: Plugins

# Every catalogue entry's end-to-end scenario, every day, against a Cabinet built from main: the
# catalogue ships inside the app, so the entries a scenario reads are the ones this build carries.
# A vendor that moves a download or changes an installer shows up here without anyone pushing.
# GitHub starts a scheduled run about five hours after its cron, so the cron sits early enough
# that the results are still in by the morning.
on:
  schedule:
    - cron: '23 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Report plugin scenario coverage
        run: scripts/scenario-coverage.sh

  build:
    uses: ./.github/workflows/build.yml

  plan:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      shards: ${{ steps.deal.outputs.shards }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the timings of the last run that left them
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh run list --repo "${GITHUB_REPOSITORY}" --workflow plugins.yml --status completed \
              --limit 10 --json databaseId --jq '.[].databaseId'); do
            gh run download "${id}" --repo "${GITHUB_REPOSITORY}" --pattern 'runtime*' --dir previous && break
            rm -rf previous
          done

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the CI tools
        run: dotnet build tools/Cabinet.Ci --nologo -v q -o "${RUNNER_TEMP}/ci"

      - name: Deal the scenarios into shards
        id: deal
        run: |
          shards="$(dotnet "${RUNNER_TEMP}/ci/Cabinet.Ci.dll" scenario-shards previous 3)"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  runtime:
    name: runtime ${{ matrix.shard }}
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.shards) }}
    uses: ./.github/workflows/runtime.yml
    permissions:
      actions: read
      contents: read
      packages: read
    with:
      suite: scenarios
      scenarios: ${{ matrix.classes }}
      artifact_name: runtime-${{ matrix.shard }}
    secrets:
      EMAIL: ${{ secrets.EMAIL }}
      PASSWORD: ${{ secrets.PASSWORD }}
      DROPBOX: ${{ secrets.DROPBOX }}
      USERNAME: ${{ secrets.USERNAME }}
      NATIVE_ACCESS: ${{ secrets.NATIVE_ACCESS }}
      WAVES: ${{ secrets.WAVES }}
      EMAIL_IMAP_HOST: ${{ vars.EMAIL_IMAP_HOST }}
      EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}

  diagnose:
    needs: runtime
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: runtime-*
          path: runtime

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the CI tools
        run: dotnet build tools/Cabinet.Ci --nologo -v q -o "${RUNNER_TEMP}/ci"

      - name: Diagnose the failed scenarios
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          DROPBOX: ${{ secrets.DROPBOX }}
          USERNAME: ${{ secrets.USERNAME }}
          NATIVE_ACCESS: ${{ secrets.NATIVE_ACCESS }}
          WAVES: ${{ secrets.WAVES }}
        run: |
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo '## AI summary'
            echo
            echo "The plugin scenarios failed in [run ${GITHUB_RUN_ID}](${run}) at commit ${GITHUB_SHA::7}."
            echo "Its \`runtime-*\` artifacts hold every log, and the captures of each failed scenario, until $(date -u -d '+7 days' +%F)."
            echo
            dotnet "${RUNNER_TEMP}/ci/Cabinet.Ci.dll" scenario-diagnosis runtime/*
          } > diagnosis.md
          cat diagnosis.md >> "${GITHUB_STEP_SUMMARY}"

      - name: Email the full diagnosis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.agentmail.to' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_TO: ${{ secrets.SMTP_TO || vars.SMTP_TO }}
        run: scripts/email-diagnosis.sh diagnosis.md
