name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_fixtures:
        description: >-
          Install the runtime fixtures from scratch: a squashed image and a new
          FabFilter trial, at the cost of a run of hours
        type: boolean
        default: false
  # Weekly, so the Flathub extensions mirrored beside Cabinet pick up their security updates
  # without waiting for a release.
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.mark12870.cabinet
  # Parents kept behind each head when pruning, so `flatpak update --commit=` has
  # somewhere to go. Lower than beeper-flatpak's 100 on purpose: Cabinet bundles
  # Wine, so a retained commit is tens of megabytes rather than a few kilobytes.
  HISTORY_DEPTH: 10
  CONTAINER_IMAGE: flathub-infra/flatpak-github-actions
  CONTAINER_TAG: gnome-50
  # Everything the Flatpak is built against. Installed and recorded from this one list, so the
  # job summary names the exact commit of each input a build used.
  BUILD_REFS: >-
    org.gnome.Platform//50
    org.gnome.Sdk//50
    org.freedesktop.Sdk.Extension.rust-stable//25.08
    org.freedesktop.Sdk.Extension.dotnet10//25.08
    org.freedesktop.Sdk.Extension.llvm20//25.08
    org.freedesktop.Sdk.Compat.i386//25.08
    org.winehq.Wine//stable-25.08

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.gate.outputs.release }}
      publish: ${{ steps.gate.outputs.publish }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # bwrap needs to set up its own namespaces to run inside a container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # checks.sh re-execs into org.gnome.Sdk but keeps this HOME, so restore lands here.
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ hashFiles('**/*.csproj', 'src/Directory.Build.props',
            'nuget-sources.json') }}
          restore-keys: nuget-

      - name: Install the SDK and the toolchains checks.sh enters
        run: |
          flatpak install -y --noninteractive flathub \
            org.gnome.Sdk//50 \
            org.freedesktop.Sdk.Extension.dotnet10//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08 \
            org.freedesktop.Sdk.Extension.llvm20//25.08

      - name: Checks
        run: scripts/checks.sh

      - name: Decide whether to publish
        id: gate
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          newest() { grep -oE '<release[[:space:]]+version="[^"]+"' | head -1 | cut -d'"' -f2; }

          version="$(newest < "${APP_ID}.metainfo.xml")"
          [ -n "${version}" ] || {
            echo "::error::no <release> version in ${APP_ID}.metainfo.xml"; exit 1; }

          owner="${GITHUB_REPOSITORY%%/*}"
          url="https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/repo/"

          # Branch on the status itself, not on curl's exit: -f collapses every 4xx
          # and 5xx into exit 22, so a 403 or a down Pages would read as "nothing
          # published yet" and publish over it.
          code="$(curl -sSI -o /dev/null -w '%{http_code}' \
                  --retry 3 --retry-all-errors "${url}summary")" || code=000
          published=""
          case "${code}" in
            200)
              ref="app/${APP_ID}/x86_64/stable"
              metainfo="/files/share/metainfo/${APP_ID}.metainfo.xml"
              ostree --repo="${RUNNER_TEMP}/published" init --mode=archive-z2
              ostree --repo="${RUNNER_TEMP}/published" remote add --no-gpg-verify published "${url}"
              ostree --repo="${RUNNER_TEMP}/published" pull \
                --subpath="$(dirname "${metainfo}")" published "${ref}"
              published="$(ostree --repo="${RUNNER_TEMP}/published" cat \
                "published:${ref}" "${metainfo}" | newest)" ;;
            404|410)
              echo "::notice::nothing published at ${url} yet" ;;
            *)
              echo "::error::cannot reach ${url} (HTTP ${code})"
              exit 1 ;;
          esac

          if [ "${version}" = "${published}" ]; then
            echo "::notice::${version} is already published; nothing to release"
            release=false
          else
            echo "::notice::releasing ${version}${published:+ over ${published}}"
            release=true
          fi
          echo "release=${release}" >> "$GITHUB_OUTPUT"

          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) publish=true ;;
            *) publish="${release}" ;;
          esac
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  # Runs on every push and pull request, not only for a release, so a green run means the
  # artifact builds. Only a new version ships this very build; a refresh republishes what is out.
  # It does not wait for checks: publish does, so a build nothing gates is only spent minutes.
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      # bwrap needs to set up its own namespaces to build inside a container.
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      # Without this the repo starts empty every run and each export is a parentless
      # root: nothing to roll back to. Seeding it first makes the new commit a child
      # of the published one. Deleting this step is how you re-root deliberately.
      - name: Seed the repo from the published history
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          scripts/seed-repo.sh \
            "https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/repo/" repo

      - name: Install the runtime, SDK, Wine and the build toolchains
        run: flatpak install -y --noninteractive flathub ${BUILD_REFS}

      # /app/manifest.json records the runtime, SDK and Wine base commits, but not the SDK
      # extensions, and nothing records the container image, which is referenced by tag.
      - name: Record the build inputs
        run: |
          token="$(curl -sSf --retry 3 \
                   "https://ghcr.io/token?scope=repository:${CONTAINER_IMAGE}:pull" |
                   sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          digest="$(curl -sSfI --retry 3 -H "Authorization: Bearer ${token}" \
                    -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                    "https://ghcr.io/v2/${CONTAINER_IMAGE}/manifests/${CONTAINER_TAG}" |
                    tr -d '\r' | sed -n 's/^docker-content-digest: //Ip')"
          {
            echo "### Build inputs"
            echo
            echo "| Input | Commit | Version |"
            echo "| --- | --- | --- |"
            echo "| \`ghcr.io/${CONTAINER_IMAGE}:${CONTAINER_TAG}\` | \`${digest:-unresolved}\` | |"
            for ref in ${BUILD_REFS}; do
              commit="$(flatpak info --show-commit "${ref}")"
              version="$(flatpak info "${ref}" | sed -n 's/^ *Version: //p')"
              echo "| \`${ref}\` | \`${commit}\` | ${version} |"
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      # Keyed on what the modules before `cabinet` are built from, so yabridge's serial
      # compile is reused until its version or a patch changes. An exact hit is not written
      # back, which also keeps the entry from being evicted for disuse.
      - uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: >-
            flatpak-builder-${{ hashFiles('io.github.mark12870.cabinet.yml', 'patches/**',
            'nuget-sources.json', 'shim/Cargo.lock') }}
          restore-keys: flatpak-builder-

      - name: Build
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            --disable-rofiles-fuse \
            --default-branch=stable \
            build "${APP_ID}.yml"

      - name: Check the artifact
        run: scripts/check-artifact.sh build

      # Tarred because upload-artifact does not preserve the symlinks an OSTree
      # repository is built out of.
      - name: Pack the repo
        run: tar -cf repo.tar repo

      # An OSTree repo is compressed objects already, so the default deflate pass spends a minute
      # of two runners' time to save nothing.
      - uses: actions/upload-artifact@v7
        with:
          name: repo
          path: repo.tar
          retention-days: 1
          compression-level: 0

  # TESTS.md's suite, against the artifact `build` just made: it loads real plugins, opens their
  # editors and drives a pointer over them, which nothing in checks.sh can do. The fixtures --
  # prefixes, runners, Carla and the vendor installs, about 16 GB of them -- ride in a container
  # image rather than a cache, which holds 10 GB for a whole repository, and a run commits back
  # whatever it had to add. scripts/runtime-ci.sh drives every step inside the container.
  # A push that only rewrites prose cannot change what a plugin does, and the runtime job is the
  # long one. Anything else, and anything that is not a push, runs it.
  scope:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.decide.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the runtime suite has anything to prove
        id: decide
        run: |
          prose='^(README|TESTS|AGENTS|CLAUDE|SOURCES|PATCHES|TODO)\.md$|^site/|^\.claude/'
          before='${{ github.event.before }}'

          if [ '${{ github.event_name }}' != push ] ||
             ! git rev-parse --quiet --verify "${before}^{commit}" >/dev/null; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${before}" "${GITHUB_SHA}")"
          if [ -z "${changed}" ] || printf '%s\n' "${changed}" | grep -qvE "${prose}"; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::only prose changed; the runtime suite has nothing to prove'
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          fi

  runtime:
    needs: [build, scope]
    if: >-
      needs.scope.outputs.runtime == 'true'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # A run with nothing to reuse installs everything itself, vendor installers and all.
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write
    env:
      # The plain image, not fedora-toolbox: the toolbox one is 2.1 GB before a single package,
      # and `prepare` names everything the suite needs anyway.
      BASE: registry.fedoraproject.org/fedora:44
      CONTAINER: cabinet-runtime
    steps:
      - uses: actions/checkout@v7

      # A registry name has to be lowercase and GitHub has no expression for that, so the shell
      # does it, the same way the publish job builds the Pages url.
      - name: Name the fixture image
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          echo "IMAGE=ghcr.io/${owner,,}/cabinet-runtime:latest" >> "$GITHUB_ENV"

      # Started here and waited for below: the artifact, the untar and the cache restore are a
      # couple of minutes that the image can spend downloading instead of waiting its turn.
      - name: Start pulling the fixture image
        id: pull
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin

          if [ '${{ inputs.rebuild_fixtures }}' = true ]; then
            echo '::notice::rebuilding the fixtures from scratch'
            exit 0
          fi

          ( docker pull "${IMAGE}" > pull.log 2>&1; echo "$?" > pull.status ) &
          echo "$!" > pull.pid

      # Two minutes of deleting the runner's preinstalled toolchains, which nothing here needs.
      # Backgrounded like the pull, so the two happen at once and the container start waits for
      # whichever finishes last.
      - name: Make room for the image
        run: |
          ( sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/ghc \
              /usr/share/dotnet /usr/share/swift /opt/hostedtoolcache ) >/dev/null 2>&1 &
          echo "$!" > room.pid

      - uses: actions/download-artifact@v8
        with:
          name: repo

      # The tar is dropped because the container takes a copy of this directory.
      - name: Unpack the built repo
        run: |
          tar -xf repo.tar
          rm repo.tar
          chmod -R a+rX repo

      # The month is in the key and there is no fallback key on purpose: the vendors' fixtures are
      # reinstalled at the turn of each month, which is what starts FabFilter's 30-day trial over,
      # and a catalogue change installs against the entries it changed rather than around them.
      - name: Work out the fixture key
        id: fixtures
        run: |
          hash='${{ hashFiles('data/library/**', 'scripts/setup-runtime-tests.sh') }}'
          echo "key=runtime-fixtures-$(date -u +%Y%m)-${hash}" >> "$GITHUB_OUTPUT"

      # The vendors' half of the fixtures. It may not be published, so it lives here rather than
      # in the image: a cache is readable only by this repository's own workflows.
      - uses: actions/cache/restore@v4
        id: cached
        if: ${{ !inputs.rebuild_fixtures }}
        with:
          path: fixtures.tar
          key: ${{ steps.fixtures.outputs.key }}

      # Nothing published at the tag yet, or a rebuild was asked for: start from the base image
      # and let the setup make everything. That is how the tag is seeded, how it returns if it is
      # deleted, and how the layers a run adds are squashed back to one.
      - name: Take the fixture image
        id: image
        run: |
          if [ ! -f pull.pid ]; then
            echo "from=${BASE}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tail --pid="$(cat pull.pid)" -f /dev/null
          cat pull.log

          if [ "$(cat pull.status)" = 0 ]; then
            echo "from=${IMAGE}" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${IMAGE} is not published yet; this run installs the fixtures itself"
            echo "from=${BASE}" >> "$GITHUB_OUTPUT"
          fi

      # bwrap needs its own namespaces for every flatpak run inside, and flatpak install of an
      # extra-data ref needs the fuse device.
      - name: Start the container
        run: |
          tail --pid="$(cat room.pid)" -f /dev/null
          df -h / | tee -a "${GITHUB_STEP_SUMMARY}"
          docker run --detach --name "${CONTAINER}" --privileged --device /dev/fuse \
            --volume "${PWD}:/src:ro" "${{ steps.image.outputs.from }}" sleep infinity

      - name: Install the tools
        if: steps.image.outputs.from == env.BASE
        run: docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh prepare

      # The drag-and-drop probes ask whether a yabridge patch can go, not whether this commit
      # works, and their prefixes and runners are five gigabytes. They run when the fixtures are
      # being made -- a rebuild, or the month turning over -- and `clean` keeps them out of the
      # image either way.
      - name: Decide whether the probes run
        id: probes
        run: |
          if [ '${{ inputs.rebuild_fixtures }}' = true ] ||
             [ '${{ steps.cached.outputs.cache-hit }}' != true ]; then
            echo 'value=1' >> "$GITHUB_OUTPUT"
          else
            echo 'value=0' >> "$GITHUB_OUTPUT"
          fi

      - name: Put the built Cabinet and the cached fixtures in place
        id: setup
        env:
          PROBES: ${{ steps.probes.outputs.value }}
        run: |
          docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh sync
          if [ -f fixtures.tar ]; then
            docker cp fixtures.tar "${CONTAINER}:/tmp/fixtures.tar"
            docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh restore /tmp/fixtures.tar
          fi
          docker exec --env CABINET_RUNTIME_PROBES="${PROBES}" \
            "${CONTAINER}" /src/scripts/runtime-ci.sh setup

      - name: Runtime tests
        env:
          PROBES: ${{ steps.probes.outputs.value }}
        run: |
          docker exec --env CABINET_RUNTIME_PROBES="${PROBES}" \
            "${CONTAINER}" /src/scripts/runtime-ci.sh test

      - name: Collect the captures and the logs
        if: always()
        run: |
          docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh collect /tmp/runtime
          docker cp "${CONTAINER}:/tmp/runtime" runtime

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: runtime
          path: runtime
          retention-days: 7

      # What the probes measured belongs on the run page. A failure here is a number, and reading
      # it should not need an artifact download and a token.
      - name: Report what the editors measured
        if: always()
        run: |
          {
            echo '### Editors'
            echo
            echo '```'
            for result in runtime/interaction/*/result.txt; do
              [ -f "${result}" ] || continue
              printf '%s\n' "$(basename "$(dirname "${result}")")"
              sed 's/^/  /' "${result}"
            done
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Kept on the setup, not on the tests. A plugin that fails the first time its editor opens --
      # Decent Sampler does, with no config of its own yet -- would otherwise keep the fixtures
      # from ever being kept, and every push would reinstall them and fail again.
      - name: Pack the private fixtures
        if: >-
          !cancelled() && steps.setup.outcome == 'success'
          && steps.cached.outputs.cache-hit != 'true'
        run: |
          docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh save /tmp/fixtures.tar
          docker cp "${CONTAINER}:/tmp/fixtures.tar" fixtures.tar

      - uses: actions/cache/save@v4
        if: >-
          !cancelled() && steps.setup.outcome == 'success'
          && steps.cached.outputs.cache-hit != 'true'
        with:
          path: fixtures.tar
          key: ${{ steps.fixtures.outputs.key }}

      # Only when this run made fixtures: otherwise the image it pulled is already what the next
      # push wants, and pushing it back costs minutes and a layer for nothing. `clean` runs first,
      # and it is what keeps a vendor's binaries out of the layer.
      - name: Keep the free fixtures
        if: >-
          !cancelled() && steps.setup.outcome == 'success'
          && github.event_name == 'push'
          && (steps.image.outputs.from == env.BASE
          || steps.cached.outputs.cache-hit != 'true')
        run: |
          docker exec "${CONTAINER}" /src/scripts/runtime-ci.sh clean
          docker commit "${CONTAINER}" "${IMAGE}"
          docker push "${IMAGE}"

  publish:
    needs: [checks, build, runtime]
    if: >-
      always() && needs.checks.outputs.publish == 'true'
      && (needs.build.result == 'success' || needs.checks.outputs.release != 'true')
      && (needs.runtime.result == 'success' || needs.checks.outputs.release != 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Backstop: seeding and mirroring take minutes and every other step seconds, so
    # anything past this is wedged, and a wedged job holds the concurrency group for the
    # six-hour limit.
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Only for scripts/ and site/ -- the repo itself comes from the artifact.
      - uses: actions/checkout@v7

      - name: Install flatpak
        # Ubuntu's indexes come from GitHub's Azure-first mirrorlist. apt's default
        # 120 s timeout times its retries turns one unreachable mirror into a step
        # that outlasts the job limit -- and the concurrency group then holds every
        # later run behind it. Bound the wait so the fallback mirror takes over.
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 update
          sudo apt-get install -y --no-install-recommends flatpak ostree

      - uses: actions/download-artifact@v8
        if: needs.checks.outputs.release == 'true'
        with:
          name: repo

      - name: Unpack the built repo
        if: needs.checks.outputs.release == 'true'
        run: |
          # flatpak-builder already wrote it as archive-z2, which is what Pages
          # needs to serve; the tar lands as _site/repo.
          mkdir -p _site
          tar -xf repo.tar -C _site

      # A refresh republishes what is already out, never a rebuild of the same version.
      - name: Take the published repo
        if: needs.checks.outputs.release != 'true'
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          mkdir -p _site
          scripts/seed-repo.sh \
            "https://${owner,,}.github.io/${GITHUB_REPOSITORY#*/}/repo/" _site/repo

      # Flatpak looks for an app's extensions only in the remote the app came from, so
      # Cabinet's remote has to carry the Flathub ones it downloads with the app.
      - name: Mirror the Flathub extensions
        id: mirror
        run: |
          changed="$(scripts/mirror-extensions.sh _site/repo)"
          if [ -n "${changed}" ] || [ "${{ needs.checks.outputs.release }}" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::the mirrored extensions are current; nothing to publish"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        if: steps.mirror.outputs.deploy == 'true'
        id: pages

      - name: Import the signing key
        if: steps.mirror.outputs.deploy == 'true'
        id: gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Hard failure rather than a quiet unsigned publish: clients that added the
          # remote while it was signed break on an unsigned update, and a green build
          # should never silently downgrade that.
          if [ -z "${GPG_PRIVATE_KEY}" ]; then
            echo "::error::GPG_PRIVATE_KEY is missing or empty. Add it under" \
                 "Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi

          GNUPGHOME="${RUNNER_TEMP}/gnupg"
          mkdir -p "${GNUPGHOME}" && chmod 700 "${GNUPGHOME}"
          export GNUPGHOME

          # A runner has no terminal, so the agent must never reach for pinentry --
          # it would die with "Inappropriate ioctl for device".
          printf 'pinentry-mode loopback\n' > "${GNUPGHOME}/gpg.conf"
          printf 'allow-loopback-pinentry\ndefault-cache-ttl 7200\nmax-cache-ttl 7200\n' \
            > "${GNUPGHOME}/gpg-agent.conf"
          gpgconf --kill gpg-agent || true

          printf '%s\n' "${GPG_PRIVATE_KEY}" | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/ {print $10; exit}')"
          if [ -z "${keyid}" ]; then
            echo "::error::the secret imported no usable secret key"
            exit 1
          fi

          pass=()
          if [ -n "${GPG_PASSPHRASE}" ]; then
            printf '%s' "${GPG_PASSPHRASE}" > "${GNUPGHOME}/pp"
            pass=(--passphrase-file "${GNUPGHOME}/pp")
          fi

          # Sign once here: proves the key is usable and primes the agent cache so
          # ostree's GPGME signing does not prompt later.
          if ! err="$(echo smoke | gpg --batch --yes --pinentry-mode loopback \
                       ${pass[@]+"${pass[@]}"} --local-user "${keyid}" \
                       --sign --output /dev/null 2>&1)"; then
            echo "::error::cannot sign with ${keyid}: ${err//$'\n'/ } ::" \
                 "if the key has a passphrase, add it as the GPG_PASSPHRASE secret"
            exit 1
          fi

          echo "signing with ${keyid}"
          {
            echo "keyid=${keyid}"
            echo "gnupghome=${GNUPGHOME}"
          } >> "$GITHUB_OUTPUT"

      - name: Update and sign the repo
        if: steps.mirror.outputs.deploy == 'true'
        run: |
          # The build job exports commits unsigned, and a client with gpg-verify=true
          # refuses those.
          for ref in $(ostree --repo=_site/repo refs); do
            c="$(ostree --repo=_site/repo rev-parse "${ref}")"
            # Heads carried in from the published history are signed already, and
            # gpg-sign errors out rather than no-opping on those.
            [ -f "_site/repo/objects/${c:0:2}/${c:2}.commitmeta" ] && continue
            ostree --repo=_site/repo gpg-sign \
              --gpg-homedir="${{ steps.gpg.outputs.gnupghome }}" \
              "${c}" "${{ steps.gpg.outputs.keyid }}"
          done

          # No --generate-static-deltas: ostree prefers a delta over plain objects on
          # an HTTP remote, and a delta does not carry the commit's detached
          # signature, so every install would fail gpg-verify.
          if ! err="$(flatpak build-update-repo --prune \
                       --prune-depth="${HISTORY_DEPTH}" \
                       --gpg-sign="${{ steps.gpg.outputs.keyid }}" \
                       --gpg-homedir="${{ steps.gpg.outputs.gnupghome }}" \
                       _site/repo 2>&1 >/dev/null)"; then
            echo "::error::build-update-repo failed: ${err//$'\n'/ }"
            exit 1
          fi

          test -f _site/repo/summary.sig
          for ref in $(ostree --repo=_site/repo refs); do
            c="$(ostree --repo=_site/repo rev-parse "${ref}")"
            if [ ! -f "_site/repo/objects/${c:0:2}/${c:2}.commitmeta" ]; then
              echo "::error::commit for ${ref} is unsigned"
              exit 1
            fi
          done

          size="$(du -sb _site/repo | cut -f1)"
          if [ "${size}" -ge 1000000000 ]; then
            echo "::error::the repo is ${size} bytes; Pages publishes at most 1 GB"
            exit 1
          fi

      - name: Render the site
        if: steps.mirror.outputs.deploy == 'true'
        env:
          BASE: ${{ steps.pages.outputs.base_url }}
        run: |
          python3 scripts/render-site.py \
            --repo _site/repo \
            --out _site \
            --base-url "${BASE}" \
            --homepage "https://github.com/${GITHUB_REPOSITORY}" \
            --gpg-fingerprint "${{ steps.gpg.outputs.keyid }}" \
            --gpg-key "$(gpg --homedir "${{ steps.gpg.outputs.gnupghome }}" \
              --export "${{ steps.gpg.outputs.keyid }}" | base64 -w0)"

          # The metainfo points at screenshots/ on this host, and appstream fetches
          # them from there -- a missing one is a validation warning on every build.
          cp -r site/screenshots _site/screenshots

          # Stop Pages from running the upload through Jekyll.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        if: steps.mirror.outputs.deploy == 'true'
        with:
          path: _site
          # .nojekyll would otherwise be dropped.
          include-hidden-files: true

      - uses: actions/deploy-pages@v5
        if: steps.mirror.outputs.deploy == 'true'
        id: deploy
