name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rebuild_fixtures:
        description: >-
          Install the runtime fixtures from scratch: a squashed image and a new
          FabFilter trial, at the cost of a run of hours
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      checkout_ref: ${{ github.sha }}

  build:
    uses: ./.github/workflows/build.yml
    with:
      checkout_ref: ${{ github.sha }}

  scope:
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.decide.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether the runtime suite has anything to prove
        id: decide
        run: |
          prose='^(README|TESTS|AGENTS|CLAUDE|SOURCES|PATCHES|TODO)\.md$|^site/|^\.claude/'
          before='${{ github.event.before }}'

          if [ '${{ github.event_name }}' != push ] ||
             ! git rev-parse --quiet --verify "${before}^{commit}" >/dev/null; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "${before}" "${GITHUB_SHA}")"
          if [ -z "${changed}" ] || printf '%s\n' "${changed}" | grep -qvE "${prose}"; then
            echo 'runtime=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::only prose changed; the runtime suite has nothing to prove'
            echo 'runtime=false' >> "$GITHUB_OUTPUT"
          fi

  release-gate:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
    outputs:
      release: ${{ steps.gate.outputs.release }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Decide whether to publish
        id: gate
        env:
          APP_ID: io.github.mark12870.cabinet
        run: |
          url="$(scripts/pages-url.sh)"
          release="$(scripts/release-gate.sh "${APP_ID}" "${url}" "${RUNNER_TEMP}/published")"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ '${{ inputs.rebuild_fixtures }}' = true ]; then
                publish=false
              else
                publish=true
              fi ;;
            *) publish="${release}" ;;
          esac
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

  runtime:
    needs: scope
    if: >-
      needs.scope.outputs.runtime == 'true'
      && (github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    uses: ./.github/workflows/runtime.yml
    permissions:
      actions: read
      contents: read
      packages: write
    with:
      rebuild_fixtures: ${{ inputs.rebuild_fixtures || false }}
      checkout_ref: ${{ github.sha }}

  publish:
    needs: [checks, build, runtime, release-gate]
    if: >-
      always() && needs.checks.result == 'success' && needs.release-gate.result == 'success'
      && needs.release-gate.outputs.publish == 'true'
      && (needs.release-gate.outputs.release != 'true'
      || (needs.build.result == 'success' && needs.runtime.result == 'success'))
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      source_sha: ${{ github.sha }}
      release: ${{ needs.release-gate.outputs.release == 'true' }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
