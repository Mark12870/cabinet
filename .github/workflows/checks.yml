name: Checks

# Runs on everything, unlike build-publish.yml: these are cheap, and a docs-only
# push should still not be able to break the shim's tests.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Format, lint and test
        working-directory: shim
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and test
        run: |
          dotnet format --verify-no-changes
          dotnet build src/Cabinet.Cli --nologo -v q
          dotnet build src/Cabinet.Gui --nologo -v q -p:UseSharedCompilation=false
          dotnet test tests/Cabinet.Core.Tests --nologo

  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate the appstream metadata
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends appstream
          appstreamcli validate --no-net io.github.mark12870.cabinet.metainfo.xml
