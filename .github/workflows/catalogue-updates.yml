name: Catalogue updates

on:
  schedule:
    - cron: '43 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-updates
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      candidates: ${{ steps.discover.outputs.candidates }}
      base: ${{ steps.discover.outputs.base }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Discover newer upstream releases
        id: discover
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet build tools/Cabinet.Ci --nologo -v q -o "${RUNNER_TEMP}/ci"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          status=0
          dotnet "${RUNNER_TEMP}/ci/Cabinet.Ci.dll" catalogue-updates discover candidates || status=$?
          echo "candidates=$(jq -c . candidates/candidates.json)" >> "$GITHUB_OUTPUT"
          exit "$status"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: catalogue-candidates
          path: candidates
          retention-days: 7

  propose:
    needs: discover
    if: >-
      !cancelled()
      && needs.discover.outputs.candidates != '' && needs.discover.outputs.candidates != '[]'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.discover.outputs.base }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: catalogue-candidates
          path: ${{ runner.temp }}/candidates

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build the trusted release helper
        run: dotnet build tools/Cabinet.Ci --nologo -v q -o "${RUNNER_TEMP}/ci"

      - name: Apply the catalogue batch and prepare its release notes
        env:
          BASE: ${{ needs.discover.outputs.base }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATES: ${{ needs.discover.outputs.candidates }}
        run: |
          set -euo pipefail
          [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$BASE" ]
          current=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" != "$BASE" ]; then
            echo '::notice::main moved after discovery; no catalogue candidates were applied'
            exit 1
          fi

          jq -e 'type == "array" and length > 0 and all(.[];
            type == "object" and (.id | type == "string" and test("^[a-z0-9]+(-[a-z0-9]+)*$")) and
            (.path | type == "string" and test("^[a-z0-9-]+/[a-z0-9-]+\\.yml$")) and
            (.version | type == "string")) and
            ([.[].id] | length == (unique | length))' <<< "$CANDIDATES" >/dev/null

          baseline="${RUNNER_TEMP}/catalogue-baseline"
          metainfo=flatpak/io.github.mark12870.cabinet.metainfo.xml
          mkdir -p "$baseline/flatpak"
          cp "$metainfo" "$baseline/$metainfo"
          ids=()
          while IFS=$'\t' read -r id path; do
            [[ "$id" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            [[ "$path" =~ ^([a-z0-9-]+)/([a-z0-9-]+)\.yml$ ]]
            [ "${BASH_REMATCH[2]}" = "$id" ]
            entry="data/library/$path"
            mkdir -p "$baseline/data/library/$(dirname "$path")"
            cp "$entry" "$baseline/$entry"
            cp "${RUNNER_TEMP}/candidates/$id.yml" "$entry"
            ids+=("$id")
          done < <(jq -r '.[] | [.id, .path] | @tsv' <<< "$CANDIDATES")
          printf '%s\n' "${ids[@]}" | jq -R . | jq -s . > "${RUNNER_TEMP}/catalogue-ids.json"
          dotnet "${RUNNER_TEMP}/ci/Cabinet.Ci.dll" catalogue-updates release \
            "$baseline" "${RUNNER_TEMP}/catalogue-ids.json" "$(date -u +%F)"

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          token: ${{ github.token }}
          sign-commits: true
          branch: catalogue-updates
          base: main
          add-paths: |
            data/library/**/*.yml
            flatpak/io.github.mark12870.cabinet.metainfo.xml
          commit-message: 'Batch catalogue updates [skip ci]'
          title: 'Batch catalogue updates'
          body: >-
            Discovered from configured upstream sources. This single batch is validated and tested
            by an explicit trusted-main dispatch; publication uses that same tested build after
            the tested head is promoted to main.

      - name: Dispatch candidate CI
        if: steps.pr.outputs.pull-request-number != '' && steps.pr.outputs.pull-request-head-sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
          HEAD: ${{ steps.pr.outputs.pull-request-head-sha }}
        run: |
          set -euo pipefail
          pull_request=$(gh api "repos/$GH_REPO/pulls/$PR")
          jq -e --arg head "$HEAD" '.state == "open" and .head.sha == $head' <<< "$pull_request" >/dev/null
          gh workflow run ci.yml --ref main -f candidate_pr="$PR" -f candidate_head="$HEAD"
