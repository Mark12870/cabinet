name: Build
description: Build the Flatpak into an OSTree repo and upload it as the repo artifact.

runs:
  using: composite
  steps:
    # An action has no env block of its own. CONTAINER_IMAGE and CONTAINER_TAG are only for
    # recording which image a build ran in: a job's `container:` cannot read `env`, so the checks
    # job in ci.yml and the build jobs in ci.yml and plugins.yml name the same image literally, and
    # these two have to be changed with them. BUILD_REFS is everything the Flatpak is built
    # against, installed and recorded from this one list, so the job summary names the exact
    # commit of each input a build used.
    - name: Name the build inputs
      shell: bash -e {0}
      run: |
        {
          echo 'APP_ID=io.github.mark12870.cabinet'
          echo 'CONTAINER_IMAGE=flathub-infra/flatpak-github-actions'
          echo 'CONTAINER_TAG=gnome-50'
          echo 'BUILD_REFS=org.gnome.Platform//50 org.gnome.Sdk//50' \
            'org.freedesktop.Sdk.Extension.rust-stable//25.08' \
            'org.freedesktop.Sdk.Extension.dotnet10//25.08' \
            'org.freedesktop.Sdk.Extension.llvm20//25.08' \
            'org.freedesktop.Sdk.Compat.i386//25.08' \
            'org.winehq.Wine//stable-25.08'
        } >> "$GITHUB_ENV"

    # Without this the repo starts empty and each export is a parentless root: nothing to roll
    # back to. Seeding makes the new commit a child of the published one, which matters only for
    # a build that can publish -- and costs two minutes of the critical path for one that cannot,
    # since nothing ever reads its artifact. Deleting this step is how you re-root deliberately.
    - name: Seed the repo from the published history
      shell: bash -e {0}
      run: |
        url="$(scripts/pages-url.sh)"

        if [ '${{ github.event_name }}' = pull_request ] ||
           [ "$(scripts/release-gate.sh "${APP_ID}" "${url}" "${RUNNER_TEMP}/published")" != true ]
        then
          echo '::notice::this build cannot release, so it has no history to parent'
          exit 0
        fi

        scripts/seed-repo.sh "${url}" repo

    - name: Install the runtime, SDK, Wine and the build toolchains
      shell: bash -e {0}
      run: flatpak install -y --noninteractive flathub ${BUILD_REFS}

    # /app/manifest.json records the runtime, SDK and Wine base commits, but not the SDK
    # extensions, and nothing records the container image, which is referenced by tag.
    - name: Record the build inputs
      shell: bash -e {0}
      run: |
        token="$(curl -sSf --retry 3 \
                 "https://ghcr.io/token?scope=repository:${CONTAINER_IMAGE}:pull" |
                 sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
        digest="$(curl -sSfI --retry 3 -H "Authorization: Bearer ${token}" \
                  -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
                  "https://ghcr.io/v2/${CONTAINER_IMAGE}/manifests/${CONTAINER_TAG}" |
                  tr -d '\r' | sed -n 's/^docker-content-digest: //Ip')"
        {
          echo "### Build inputs"
          echo
          echo "| Input | Commit | Version |"
          echo "| --- | --- | --- |"
          echo "| \`ghcr.io/${CONTAINER_IMAGE}:${CONTAINER_TAG}\` | \`${digest:-unresolved}\` | |"
          for ref in ${BUILD_REFS}; do
            commit="$(flatpak info --show-commit "${ref}")"
            version="$(flatpak info "${ref}" | sed -n 's/^ *Version: //p')"
            echo "| \`${ref}\` | \`${commit}\` | ${version} |"
          done
        } | tee -a "${GITHUB_STEP_SUMMARY}"

    # Keyed on what the modules before `cabinet` are built from, so yabridge's serial
    # compile is reused until its version or a patch changes. An exact hit is not written
    # back, which also keeps the entry from being evicted for disuse.
    - uses: actions/cache@v4
      with:
        path: .flatpak-builder
        key: >-
          flatpak-builder-${{ hashFiles('io.github.mark12870.cabinet.yml', 'patches/**',
          'nuget-sources.json', 'shim/Cargo.lock') }}
        restore-keys: flatpak-builder-

    - name: Build
      shell: bash -e {0}
      run: |
        flatpak-builder \
          --repo=repo \
          --force-clean \
          --disable-rofiles-fuse \
          --default-branch=stable \
          build "${APP_ID}.yml"

    - name: Check the artifact
      shell: bash -e {0}
      run: scripts/check-artifact.sh build

    # Tarred because upload-artifact does not preserve the symlinks an OSTree
    # repository is built out of.
    - name: Pack the repo
      shell: bash -e {0}
      run: tar -cf repo.tar repo

    # An OSTree repo is compressed objects already, so the default deflate pass spends a minute
    # of two runners' time to save nothing.
    - uses: actions/upload-artifact@v7
      with:
        name: repo
        path: repo.tar
        retention-days: 1
        compression-level: 0
